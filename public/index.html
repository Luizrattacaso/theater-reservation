<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Automação de Ingressos</title>
    <style>
        :root {
            --bg-color: #ffffff;
            --text-main: #1a1a1a;
            --text-muted: #666666;
            --border-color: #e5e5e5;
            --input-bg: #fafafa;
            --btn-primary: #1a1a1a;
            --btn-primary-hover: #333333;
        }

        body { 
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; 
            max-width: 500px; 
            margin: 3rem auto; 
            padding: 0 1.5rem; 
            color: var(--text-main);
            background-color: var(--bg-color);
        }

        .lang-switch {
            display: flex;
            align-items: center;
            justify-content: flex-end;
            gap: 0.5rem;
            margin-bottom: 1rem;
        }
        .lang-switch span {
            font-size: 0.8rem;
            color: var(--text-muted);
            font-weight: 500;
        }
        .toggle-switch {
            position: relative;
            width: 44px;
            height: 24px;
        }
        .toggle-switch input {
            opacity: 0;
            width: 0;
            height: 0;
        }
        .toggle-slider {
            position: absolute;
            cursor: pointer;
            top: 0; left: 0; right: 0; bottom: 0;
            background-color: var(--border-color);
            transition: 0.3s;
            border-radius: 24px;
        }
        .toggle-slider:before {
            position: absolute;
            content: "";
            height: 18px;
            width: 18px;
            left: 3px;
            bottom: 3px;
            background-color: white;
            transition: 0.3s;
            border-radius: 50%;
        }
        input:checked + .toggle-slider {
            background-color: var(--btn-primary);
        }
        input:checked + .toggle-slider:before {
            transform: translateX(20px);
        }

        h2 { 
            font-weight: 500; 
            font-size: 1.4rem;
            margin-bottom: 2rem;
            padding-bottom: 1rem;
            border-bottom: 1px solid var(--border-color);
            letter-spacing: -0.5px;
        }

        h3 {
            font-weight: 500;
            font-size: 1rem;
            margin-top: 2rem;
            margin-bottom: 0.5rem;
        }

        .form-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 1rem;
            margin-bottom: 1.5rem;
        }

        .full-width {
            grid-column: 1 / -1;
        }

        label { 
            display: block; 
            margin-bottom: 0.4rem; 
            font-size: 0.85rem; 
            color: var(--text-muted);
        }

        input, select { 
            width: 100%; 
            padding: 0.6rem; 
            box-sizing: border-box; 
            border: 1px solid var(--border-color); 
            border-radius: 6px;
            background-color: var(--input-bg);
            font-family: inherit;
            font-size: 0.9rem;
            color: var(--text-main);
            transition: border-color 0.2s;
        }

        input:focus, select:focus {
            outline: none;
            border-color: #999;
        }

        .button-group {
            display: flex;
            gap: 1rem;
            margin-top: 2rem;
        }

        button { 
            flex: 1;
            padding: 0.7rem; 
            border: 1px solid transparent; 
            cursor: pointer; 
            font-size: 0.9rem; 
            border-radius: 6px;
            transition: all 0.2s ease;
        }

        #startBtn { 
            background: var(--btn-primary); 
            color: white; 
        }

        #startBtn:hover:not(:disabled) {
            background: var(--btn-primary-hover);
        }

        #stopBtn { 
            background: transparent; 
            color: var(--text-main); 
            border-color: var(--border-color);
        }

        #stopBtn:hover:not(:disabled) {
            background: var(--input-bg);
        }

        button:disabled { 
            opacity: 0.4; 
            cursor: not-allowed; 
        }

        #logs { 
            background: var(--input-bg); 
            color: var(--text-muted); 
            padding: 1rem; 
            height: 180px; 
            overflow-y: auto; 
            font-family: 'Courier New', Courier, monospace; 
            font-size: 0.85rem;
            border-radius: 6px;
            border: 1px solid var(--border-color);
        }
    </style>
</head>
<body>
    <!-- Language Switch -->
    <div class="lang-switch">
        <span>PT</span>
        <label class="toggle-switch">
            <input type="checkbox" id="langToggle">
            <span class="toggle-slider"></span>
        </label>
        <span>EN</span>
    </div>

    <h2 data-i18n="title">Automação de Ingressos</h2>
    
    <div class="form-grid">
        <div class="full-width">
            <label for="movieName" data-i18n="movieName">Nome do Filme</label>
            <input type="text" id="movieName" data-i18n-placeholder="movieNamePlaceholder" placeholder="Ex: Oppenheimer">
        </div>

        <div>
            <label for="movieDate" data-i18n="date">Data</label>
            <input type="date" id="movieDate">
        </div>

        <div>
            <label for="movieTime" data-i18n="time">Hora</label>
            <input type="text" id="movieTime" placeholder="23:59" maxlength="5">
        </div>

        <div class="full-width">
            <label for="movieLocation" data-i18n="location">Local</label>
            <select id="movieLocation">
                <option value="" disabled selected data-i18n="locationPlaceholder">Selecione o cinema...</option>
                <option value="delux">Delux</option>
                <option value="uci">UCI</option>
                <option value="cinemark">Cinemark</option>
            </select>
        </div>

        <div>
            <label for="seatRow" data-i18n="seatRow">Fila (Letra)</label>
            <input type="text" id="seatRow" data-i18n-placeholder="seatRowPlaceholder" placeholder="Ex: H" maxlength="2">
        </div>

        <div>
            <label for="seatCol" data-i18n="seatCol">Assento (Número)</label>
            <input type="number" id="seatCol" data-i18n-placeholder="seatColPlaceholder" placeholder="Ex: 12" min="1">
        </div>

        <div class="full-width">
            <label for="timeInput" data-i18n="maxTime">Tempo máximo de busca (horas)</label>
            <input type="number" id="timeInput" value="2" min="1">
        </div>
    </div>

    <div class="button-group">
        <button id="startBtn" data-i18n="startBtn">Iniciar Busca</button>
        <button id="stopBtn" disabled data-i18n="stopBtn">Parar Busca</button>
    </div>

    <h3>
        <span data-i18n="status">Status:</span> 
        <span id="statusText" data-i18n="inactive" style="color: var(--text-muted); font-weight: 400;">Inativo</span>
    </h3>
    <div id="logs" data-i18n="waiting">Aguardando configuração...</div>

    <script>
        const translations = {
            pt: {
                title: "Automação de Ingressos",
                movieName: "Nome do Filme",
                movieNamePlaceholder: "Ex: Oppenheimer",
                date: "Data",
                time: "Hora",
                location: "Local",
                locationPlaceholder: "Selecione o cinema...",
                seatRow: "Fila (Letra)",
                seatRowPlaceholder: "Ex: H",
                seatCol: "Assento (Número)",
                seatColPlaceholder: "Ex: 12",
                maxTime: "Tempo máximo de busca (horas)",
                startBtn: "Iniciar Busca",
                stopBtn: "Parar Busca",
                status: "Status:",
                inactive: "Inativo",
                waiting: "Aguardando configuração..."
            },
            en: {
                title: "Ticket Automation",
                movieName: "Movie Name",
                movieNamePlaceholder: "e.g., Oppenheimer",
                date: "Date",
                time: "Time",
                location: "Location",
                locationPlaceholder: "Select the cinema...",
                seatRow: "Row (Letter)",
                seatRowPlaceholder: "e.g., H",
                seatCol: "Seat (Number)",
                seatColPlaceholder: "e.g., 12",
                maxTime: "Max search time (hours)",
                startBtn: "Start Search",
                stopBtn: "Stop Search",
                status: "Status:",
                inactive: "Inactive",
                waiting: "Waiting for configuration..."
            }
        };

        function t(key) {
            const lang = document.getElementById('langToggle').checked ? 'en' : 'pt';
            return translations[lang][key] || key;
        }

        function applyTranslations() {
            const lang = document.getElementById('langToggle').checked ? 'en' : 'pt';
            document.documentElement.lang = lang === 'pt' ? 'pt-BR' : 'en';
            
            document.querySelectorAll('[data-i18n]').forEach(el => {
                const key = el.getAttribute('data-i18n');
                if (translations[lang][key]) {
                    el.textContent = translations[lang][key];
                }
            });

            document.querySelectorAll('[data-i18n-placeholder]').forEach(el => {
                const key = el.getAttribute('data-i18n-placeholder');
                if (translations[lang][key]) {
                    el.placeholder = translations[lang][key];
                }
            });

            localStorage.setItem('preferredLang', lang);
        }

        document.addEventListener('DOMContentLoaded', () => {
            const langToggle = document.getElementById('langToggle');
            const savedLang = localStorage.getItem('preferredLang');

            if (savedLang === 'en') {
                langToggle.checked = true;
            }
            
            applyTranslations();
            langToggle.addEventListener('change', applyTranslations);
        });

        const timeInput = document.getElementById('movieTime');
        
        timeInput.addEventListener('input', function(e) {
            let value = e.target.value.replace(/\D/g, '');
            if (value.length > 2) {
                value = value.substring(0, 2) + ':' + value.substring(2, 4);
            }
            e.target.value = value;
        });

        timeInput.addEventListener('blur', function(e) {
            const timeRegex = /^([0-1][0-9]|2[0-3]):[0-5][0-9]$/; // Regex from 00:00 to 23:59
            if (e.target.value && !timeRegex.test(e.target.value)) {
                alert(document.getElementById('langToggle').checked 
                    ? 'Please enter a valid time between 00:00 and 23:59' 
                    : 'Por favor, insira um horário válido entre 00:00 e 23:59');
                e.target.value = '';
            }
        });
    </script>

    <script src="app.js"></script>
</body>
</html>
